<!doctype html>

<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Xbox Store</title>

</head>

<body>
  <!-- Header -->
  <header>
    <img class="logo" src="images.png">
    <div class="header-links">
      <a>Home</a>
      <a>Games</a>
      <a>Contacts</a>
      <button>Sign in</button>
    </div>
  </header>

  <!-- Landing Page -->
  <div class="landing">
    <div class="left_landing_page">
      <h3>Welcome To Xbox Store</h3>
      <h1>Best Cosnole To Play On</h1>
      <p>Xbox is the ultimiate device for playing</p>
      <div class="landingsearch">
        <input placeholder="Start Typing ...." /><button>Search</button>
      </div>
    </div>
    <div class="img_landing">
      <img src="[CITYPNG.COM]Xbox Series S With Series X High Resolution - 4500x4500.png">
    </div>
  </div>



  <!-- the home page -->
  <div class="trending">
    <span>Trending</span>
    <div class="game_header">
      <h1>Trending Games</h1>
      <button>View All</button>
    </div>
    
    <div class="trending_games">
      <div class="card">
        <img src="valorant.jpg">
        <div class="card_info">
          <div class="card_name">
            <P>Actions</P>
            <h3>Valorant</h3>
          </div>
          <a>
            <img src="icons8-shopping-bag-48.png" />
          </a>
        </div>
      </div>
      <div class="card">
        <img src="cyberpunk2077jpg.jpg">
        <div class="card_info">
          <div class="card_name">
            <P>Actions</P>
            <h3>CyberPunk 2077</h3>
          </div>
          <a>
            <img src="icons8-shopping-bag-48.png" />
          </a>
        </div>
      </div>
      <div class="card">
        <img src="gta6.jpg">
        <div class="card_info">
          <div class="card_name">
            <P>Actions</P>
            <h3>Grand Theft Auto VI</h3>
          </div>
          <a>
            <img src="icons8-shopping-bag-48.png" />
          </a>
        </div>
      </div>
      <div class="card">
        <img src="red dead.jpg">
        <div class="card_info">
          <div class="card_name">
            <P>Actions</P>
            <h3>Red Dead Redemption 2</h3>
          </div>
          <a>
            <img src="icons8-shopping-bag-48.png" />
          </a>
        </div>
      </div>

    </div>
  </div>
</body>
